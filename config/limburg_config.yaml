# Limburg module - standalone pipeline mirroring NDWI/'s pattern, extended
# with a Sentinel-1 SAR water-detection branch and a seed-potato overlap step.
# Independent of the main br_simulation pipeline and of NDWI/ (own boundary,
# own plots, own caches) - the two provinces are fetched separately.

aoi:
  crs: "EPSG:28992"   # Dutch RD New

region:
  province: "Limburg"
  # PDOK "BRK Bestuurlijke Gebieden" OGC API Features, collection "provinciegebied".
  # Same endpoint family as br_simulation's Groningen config (config/config.yaml) -
  # verified live 2026-10-02 for Limburg: naam=Limburg -> code=31.
  province_ogc_api_base: "https://api.pdok.nl/kadaster/brk-bestuurlijke-gebieden/ogc/v1"
  province_collection: "provinciegebied"
  province_name_field: "naam"
  province_code_field: "code"
  province_expected_code: "31"   # Limburg = PV31, confirmed live against a real /items response

seed_potato_plots:
  # Live PDOK BRP Gewaspercelen fetch - same Atom feed / full-NL GeoPackage /
  # pushed-down bbox+gewascode filter as br_simulation's seed_plots.py.
  atom_feed_url: "https://service.pdok.nl/rvo/gewaspercelen/atom/basisregistratie_gewaspercelen_brp.xml"
  gpkg_entry_id: "https://service.pdok.nl/rvo/gewaspercelen/atom/basisregistratie_gewaspercelen_brp_epsg28992_geopackage.xml"
  concept_year: 2026
  cache_dir: "limburg/data/raw/brp_cache"
  min_plausible_area_m2: 1.0
  # Same NAK/TBM seed-potato gewascodes as the Groningen config (both are
  # "Akkerbouwgewas, pootaardappelen"; NAK/TBM is a certification-status split,
  # not a different crop) - verified against rvo.nl/gewascodes/<code>.
  gewascodes:
    2015:
      gewas: "Aardappelen, poot NAK"
      category_label: "seed_nak"
    2016:
      gewas: "Aardappelen, poot TBM"
      category_label: "seed_tbm"

sentinel2:
  # Element84 Earth Search STAC over the public AWS Sentinel-2 L2A COG archive -
  # same endpoint as NDWI/config/ndwi_config.yaml, no authentication required.
  stac_endpoint: "https://earth-search.aws.element84.com/v1"
  collection: "sentinel-2-l2a"
  date_range: "2025-08-01/2025-09-30"   # Aug-Sep 2025, end of growing season
  max_cloud_cover: 20
  green_asset: "green"   # B03, 10m
  nir_asset: "nir"       # B08, 10m
  scl_asset: "scl"       # scene classification, 20m native - cloud/shadow masking
  # True-color composite (TCI, R/G/B uint8, 10m) - confirmed live 2026-10-02
  # against this same STAC endpoint's item assets. Used only for the plain
  # true-color overview panel (visualize_overview.py); NDWI math above never
  # touches this asset.
  visual_asset: "visual"
  # SCL classes masked before computing NDWI (official S2 SCL legend): 3=cloud
  # shadow, 8/9=cloud medium/high probability, 10=thin cirrus.
  scl_mask_classes: [3, 8, 9, 10]
  # McFeeters (1996) NDWI = (green - nir) / (green + nir); pixels above this
  # threshold are classified as open water (the standard 0.0 cutoff).
  ndwi_water_threshold: 0.0

sentinel1:
  # Microsoft Planetary Computer STAC. Verified live 2026-10-02: the SAS-signing
  # endpoint (/api/sas/v1/sign) signs "sentinel-1-grd" assets anonymously, no
  # subscription key needed (unlike "sentinel-1-rtc", which PC's own docs say
  # requires a registered account - avoided here for that reason).
  stac_endpoint: "https://planetarycomputer.microsoft.com/api/stac/v1"
  collection: "sentinel-1-grd"
  date_range: "2025-08-01/2025-09-30"   # same Aug-Sep 2025 window as Sentinel-2
  instrument_mode: "IW"
  vv_asset: "vv"
  vh_asset: "vh"
  calibration_vv_asset: "schema-calibration-vv"
  calibration_vh_asset: "schema-calibration-vh"
  # Minimum fraction of the province's area the selected scene(s) must cover
  # before the greedy coverage search gives up and uses what it has.
  min_coverage_fraction: 0.99
  # SAR surface-water detection via Otsu (1979) automatic thresholding on
  # calibrated VV sigma0 (dB) - water's specular backscatter is markedly lower
  # than vegetated/bare land, producing the bimodal histogram Otsu's method
  # assumes. This is the same backscatter-thresholding approach documented for
  # Sentinel-1 flood/water mapping in Martinis et al. (2015), Remote Sensing,
  # "A Fully Automated TerraSAR-X Based Flood Service" (method generalized to
  # Sentinel-1 VV in later ESA/Copernicus EMS SAR flood-mapping guidance).
  water_detection_band: "vv"
  # SAR backscatter has strong multiplicative speckle noise (coherent imaging
  # artifact, not a sensor flaw) - thresholding raw per-pixel dB values before
  # despeckling produces hundreds of thousands of spurious single-pixel
  # "water" blobs. A median filter is the standard cheap despeckling baseline
  # (a full adaptive Lee/Refined-Lee filter would preserve edges better but is
  # out of scope here); applied to VV dB before Otsu thresholding.
  speckle_filter_size_px: 5
  # Binary opening removes residual isolated noise pixels after thresholding;
  # closing fills small gaps/holes inside real water bodies. Both standard
  # post-processing steps in SAR flood-mapping pipelines (e.g. Copernicus EMS).
  morphology_struct_size_px: 3
  # Minimum mapping unit - water polygons smaller than this (post-despeckle,
  # post-morphology) are still dropped before the plot-overlap analysis, as a
  # second line of defense against noise-driven false-positive overlaps.
  min_water_body_area_m2: 1000

data_sources:
  ahn4_dtm:
    # PDOK's AHN WCS - confirmed live 2026-10-02 via GetCapabilities that only
    # two coverages are published (dtm_05m, dsm_05m); no "ahn5" coverage id and
    # no separate AHN5 WCS endpoint exists yet. AHN4 dtm_05m is therefore the
    # best/only live-fetchable DTM option - re-check GetCapabilities and update
    # coverage_id if/when PDOK publishes an AHN5 coverage.
    wcs_url: "https://service.pdok.nl/rws/ahn/wcs/v1_0"
    coverage_id: "dtm_05m"
    native_resolution_m: 0.5
    # DescribeCoverage's gml:Envelope for dtm_05m, confirmed live 2026-10-02
    # (EPSG:28992): requests are clipped to this before being sent, since a
    # subset that pokes outside it comes back as a hard WCS error rather than
    # a partially-filled response.
    coverage_bounds_28992: [10000, 306250, 280000, 618750]
    # The native 0.5m product would be 100s of GB for all of Limburg (~2200
    # km^2) - impractical for an overview figure (see
    # src/br_simulation/visualization/province_overview.py's docstring on the
    # same issue for Groningen). Each tile is instead requested already
    # downsampled via the WCS's Scaling extension (SCALEFACTOR=native/target) -
    # confirmed live 2026-10-02 that this WCS advertises and honors it
    # (ows:Profile .../WCS_service-extension_scaling/1.0/conf/scaling): a
    # 20km x 20km subset at SCALEFACTOR=0.05 returns a 2000x2000px 10m/px tiff.
    overview_resolution_m: 10
    # Resolution used by netherlands_dtm.py's whole-country fetch (a separate,
    # standalone script from the Limburg-only pipeline above). 10m/px over the
    # full coverage_bounds_28992 extent (~270km x 312.5km) would mosaic to
    # ~27000x31000px; 50m/px keeps the merged array a manageable ~5400x6250px
    # while still tiling comfortably under the WCS's MAXSIZE=4000px/axis cap
    # (180km/tile at 50m/px -> 3600px/axis).
    netherlands_overview_resolution_m: 50

  copernicus_dem_eea10:
    # Copernicus Data Space Ecosystem (CDSE) STAC - confirmed live 2026-10-02
    # via https://catalogue.dataspace.copernicus.eu/stac/collections that
    # "cop-dem-eea-10-laea-tif" is the only EEA-10 (10m, Europe-only) DEM
    # collection; GLO-30/GLO-90 are separate lower-res collections. This is
    # ESA Copernicus Contributing Missions (CCM) data under its own license
    # (linked from the collection's STAC metadata) - unlike GLO-30, it is NOT
    # on the open, anonymous AWS archive, so downloading tiles requires a free
    # CDSE account.
    stac_endpoint: "https://stac.dataspace.copernicus.eu/v1"
    collection: "cop-dem-eea-10-laea-tif"
    # Password-grant OAuth2 against CDSE's public client (no client secret) -
    # standard documented CDSE auth flow. Set CDSE_USERNAME/CDSE_PASSWORD env
    # vars before running fetch_copernicus_dem_eea10.py.
    token_url: "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token"
    client_id: "cdse-public"
    # Despite the "-laea-tif" collection name, distributed tiles are EPSG:4326
    # one-degree cells (confirmed live via item properties["proj:code"]),
    # grid:code formatted "CDEM-N50E006" etc. A bbox search against this
    # collection also returns (a) multiple reprocessing versions of the same
    # cell and (b) differently-gridded duplicate entries with non-conforming
    # grid:code width (confirmed live 2026-10-02, e.g. "CDEM-N30E39" alongside
    # the standard "CDEM-N50E006") - both filtered out before download, see
    # _select_canonical_items in fetch_copernicus_dem_eea10.py.
    grid_code_pattern: "^CDEM-[NS]\\d{2}[EW]\\d{3}$"

  hoogte_nederland_dtm:
    # PDOK WCS backing data.overheid.nl dataset #38665 ("Hoogte - Land 1 mtr
    # - Digital Terrain Model (DTM) - AHN, INSPIRE Geharmoniseerd") -
    # resolved from that dataset page via its linked Nationaal Georegister
    # metadata record (uuid 6a1c46ee-30ed-4e5e-89b7-6b12b8bc71bf) to this WCS
    # endpoint, confirmed live 2026-10-02. A *different* product/service
    # from ahn4_dtm above (same underlying AHN survey, but this is its
    # INSPIRE-harmonized "land DTM" distribution): coverage "El.GridCoverage",
    # ~1m native pixels, native CRS EPSG:4258 (ETRS89 lat/lon), MapServer-
    # backed WCS 2.0.1.
    wcs_url: "https://service.pdok.nl/rws/hoogte-nederland-land-dtm/wcs/v1_0"
    coverage_id: "El.GridCoverage"
    native_resolution_m: 1.0
    # Despite the native grid being geographic, GetCapabilities advertises -
    # and a live GetCoverage request confirmed - EPSG:28992 works as both
    # SUBSETTINGCRS and OUTPUTCRS, so requests/responses stay in the
    # project's standard CRS with no separate reprojection step.
    request_crs: "EPSG:28992"
    # Downsampling target. Requested via the WCS scaling extension's
    # SCALESIZE (explicit output width/height), not SCALEFACTOR - confirmed
    # live that SCALEFACTOR applied against this service's native geographic
    # grid produces non-square, non-round pixel sizes once reprojected to
    # EPSG:28992 (8.85m x 14.09m for a SCALEFACTOR nominally aiming at 10m),
    # whereas SCALESIZE computed directly in the output resolution gives
    # exact 10.0m x 10.0m pixels.
    overview_resolution_m: 10

waterways:
  # HDX/HOTOSM "Waterways of Netherlands" export (OpenStreetMap, ODbL) -
  # confirmed live 2026-10-02 via HDX's CKAN API (package_show for
  # hotosm_nld_waterways, https://data.humdata.org/dataset/hotosm_nld_waterways)
  # that this public, no-auth S3 object is the SHP resource
  # (202,485,681 bytes). Confirmed via the zip's own central directory that
  # it bundles three layers (waterways_points/_lines/_polygons); _lines is
  # used here (235,098 features nationwide) since it carries OSM's
  # waterway=* tag (river/stream/canal/ditch/drain/...) - _polygons is water
  # *bodies* (lakes/ponds, water=*/natural=water), a different thing.
  shp_zip_url: "https://production-raw-data-api.s3.amazonaws.com/ISO3/NLD/waterways/hotosm_nld_waterways_osm_shp.zip"
  shp_zip_size_bytes: 202485681
  lines_layer: "waterways_lines"
  # Confirmed live via the shapefile's own .prj - standard for OSM/HOT
  # exports, never reprojected by HOT.
  source_crs: "EPSG:4326"
  # Distance within which a waterway is treated as a plausible surface-water
  # exposure pathway for a seed potato plot. No authoritative NL-specific
  # standard is cited for this figure - it's a placeholder scale (same order
  # of magnitude as typical NL agricultural parcel/ditch spacing) - tune via
  # this config value, not a hardcoded constant in the script.
  buffer_distance_m: 50

dtm_burn:
  # Input: limburg/standalone/download_limburg_dtm.py's 5m AHN DTM output
  # (python limburg/standalone/download_limburg_dtm.py --province Limburg
  # --res 5, run from the repo root with its default --out ".") - path
  # relative to REPO_ROOT.
  source_dtm_path: "limburg_ahn_dtm_5m.tif"
  target_resolution_m: 10
  # Fixed-depth "ditch burning" - a simplified version of the AGREE method
  # (Hellweger 1997, used throughout DEM-hydrology preprocessing) for
  # forcing known drainage channels to stay represented as low points once
  # a DEM is coarsened, rather than being smoothed away. No site survey
  # backs this number - it's a placeholder on the order of a typical NL
  # farm ditch depth; tune via this config value, not a hardcoded constant
  # in the script.
  burn_depth_m: 1.0

paths:
  raw_dir: "limburg/data/raw"
  processed_dir: "limburg/data/processed"
  interim_dir: "limburg/data/interim"
  figures_dir: "limburg/outputs/figures"
  results_dir: "limburg/outputs/results"

visualization:
  dpi: 300

# --- Layer 0-3: origin-dependent flood-exposure routing ---------------------

bofek2020:
  # Static local layer, already present - no download. Confirmed schema (read
  # directly against the real Limburg-clipped data, not assumed): columns
  # OBJECTID_1, SHAPE_LENG, SHAPE_AREA, BOFEK2020 (map-unit code, null for
  # ~9% of polygons e.g. open water), OMSCHR (Dutch free-text description),
  # CRS EPSG:28992. 3,344 polygons intersect Limburg; real OMSCHR values
  # confirmed present include "Kleigronden (zavel en lichte klei)...",
  # "Leemgronden: zandige leem...", "Zwak/Sterk lemige zandgronden...",
  # "Dunne veengronden...", "Kalksteenverweringsgronden" (South Limburg loess).
  shapefile_zip_path: "limburg/data/BOFEK_2020_Shape.zip"
  shp_name: "BOFEK_2020.shp"
  code_field: "BOFEK2020"
  description_field: "OMSCHR"

pdok_aerial:
  # PDOK "Actueel_orthoHR" WMTS - national 8cm/px RGB aerial orthophoto.
  # GDAL's generic WMTS driver (`WMTS:<capabilities_url>,layer=...`) was
  # tried first and killed after ~100s/1.2GB with no output, even before
  # issuing a read - it appears to eagerly materialize something for the
  # full tile pyramid (134M x 134M px at native zoom) regardless of how
  # small the actual requested window is. Fetching individual REST tiles
  # directly instead, via the ResourceURL template confirmed live in
  # GetCapabilities - simpler, and only ever touches the handful of tiles a
  # given crop actually needs.
  #
  # Only ever used for TIGHT, SPECIFIC crops (Step 6's exposed-plot detail
  # panels, the scenario GIFs) - never at province scale. Zoom level 15
  # alone is a 32768x32768 tile matrix; the whole country at this
  # resolution would be multiple billion pixels.
  resource_url_template: "https://service.pdok.nl/hwh/luchtfotorgb/wmts/v1_0/Actueel_orthoHR/EPSG:28992/{level}/{col}/{row}.jpeg"
  # TileMatrixSet "EPSG:28992" origin + level-0 scale denominator, confirmed
  # live from GetCapabilities (not assumed) - resolution at level L is
  # (12288000.0 * 0.00028) / 2^L meters/px, per the OGC WMTS scale-denominator
  # convention (0.28mm reference pixel size).
  topleft_x: -285401.92
  topleft_y: 903401.92
  scale_denominator_level0: 12288000.0
  tile_px: 256
  # Tried zoom 15 (0.105 m/px, closest to the source's true 8cm native
  # resolution) first - a single exposed-plot detail crop (~500m across at
  # the buffer_m used) needs ~360 tiles at that resolution; fetching that
  # many one at a time left even the first output figure unfinished after
  # 1000+ tiles (confirmed live, not assumed slow). Zoom 13 (0.42 m/px) cuts
  # tile count ~16x for the same crop while still being ~24x sharper than
  # the 10m Sentinel-2 mosaic it replaces - still genuinely "aerial photo"
  # detail, not just a resolution number.
  zoom_level: 13   # resolution = 0.42 m/px
  max_parallel_fetches: 16   # tiles within one crop are fetched concurrently
                               # (network-bound) - sequential fetching is what
                               # made zoom 15 impractically slow above
  cache_dir: "limburg/data/raw/pdok_aerial_cache"

runoff:
  # Rational Method (Q = C*i*A). Per-cell C comes from BOFEK2020's OMSCHR
  # text, keyword-matched to a texture class (network/soil_params.py) - NOT
  # a sourced Curve-Number crosswalk (none exists for BOFEK2020's map-unit
  # codes - the shapefile carries no hydraulic fields). The class ORDER
  # (sand infiltrates more than loam, more than clay/peat) is standard
  # textbook soil hydrology (the same ordering as SCS/NRCS hydrologic soil
  # groups A-D); the specific coefficient VALUES below are uncalibrated
  # placeholders, not a Limburg-specific study result.
  #
  # Matched on the COMPOUND leading term ("kleigronden", not bare "klei"),
  # checked in the order listed, first match by position in the string wins.
  # Verified against real Limburg OMSCHR text that this correctly classifies
  # mixed-profile descriptions by their governing genetic class rather than a
  # mentioned subsoil - e.g. "Kleigronden (zavel) op zandondergrond" (a clay
  # soil whose SUBSOIL is sand) must classify as klei, not zand; bare
  # substring matching on "zand" would get this wrong since "zandondergrond"
  # appears later in the string. "moerige gronden" (mucky soils) is grouped
  # with veengronden - both are organic/peaty genetic classes in BOFEK's
  # own classification scheme, confirmed present in the real Limburg data.
  texture_keywords:
    - ["kleigronden", "klei"]
    - ["leemgronden", "leem"]
    - ["zandgronden", "zand"]
    - ["veengronden", "veen"]
    - ["moerige gronden", "veen"]
  texture_coefficients:
    zand: 0.20
    leem: 0.35
    klei: 0.50
    veen: 0.45
  runoff_coefficient_default: 0.30   # fallback: null code, or OMSCHR matches no keyword
                                       # (e.g. "Kalksteenverweringsgronden", open water)

routing:
  # Simple travel-time lag: distance / assumed_velocity_m_s. Not sourced
  # from a measured Limburg ditch-flow reference.
  assumed_velocity_m_s: 0.3

capacity_constraints:
  # No verified per-structure culvert capacity rating exists for any Limburg
  # waterschap - a single uniform placeholder threshold (m^3/s) is applied
  # everywhere until one is sourced.
  default_capacity_m3_s: 0.5

scenario_grid:
  intensity_bins_mm_hr: [10, 20, 30, 40, 60, 80]
  duration_bins_min: [30, 60, 120, 240]
  out_of_grid_policy: "error"
  cache_dir: "limburg/data/processed/layer1_cache"

dashboard:
  sliders:
    intensity_mm_hr: {min: 10, max: 80, default: 30, step: 10}
    duration_min: {min: 30, max: 240, default: 60, step: 30}
    time_window_min: {min: 15, max: 720, default: 120, step: 15}
  monte_carlo:
    n_draws_live: 200
    random_seed: 42
    gif_search_draws: 500    # random origins searched to find the most
                              # illustrative scenarios (most plots exposed in
                              # one draw; longest flow path) - cheap, ~1500/s
    gif_n_scenarios: 4        # dedicated GIFs to generate from that search
    gif_time_frames: 20       # frames per scenario GIF (time-progression,
                              # not one-frame-per-draw)
